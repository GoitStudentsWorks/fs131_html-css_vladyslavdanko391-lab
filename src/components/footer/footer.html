<footer class="footer">
  <div class="footer__container">
    <div class="footer__top">
      <div class="footer__brand">
        <a href="#home" class="footer__logo" aria-label="Booksy">
          <svg
            width="96"
            height="24"
            viewBox="0 0 96 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Booksy logo"
          >
            <path
              d="M2 4.5C2 4.5 5 3 8.5 3C10.2 3 11.4 3.5 12 4C12.6 3.5 13.8 3 15.5 3C19 3 22 4.5 22 4.5V19.5C22 19.5 19 18 15.5 18C13.8 18 12.6 18.5 12 19C11.4 18.5 10.2 18 8.5 18C5 18 2 19.5 2 19.5V4.5Z"
              stroke="#000"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <path d="M12 4V19" stroke="#000" stroke-width="1.6" />
            <text
              x="30"
              y="18"
              font-family="Inter, Arial, sans-serif"
              font-size="17"
              font-weight="600"
              fill="#000"
            >
              Booksy
            </text>
          </svg>
        </a>

        <nav class="footer__nav" aria-label="Footer navigation">
          <ul class="footer__list">
            <li><a class="footer__link" href="#home">Home</a></li>
            <li><a class="footer__link" href="#books">Books</a></li>
            <li><a class="footer__link" href="#feedback">Feedback</a></li>
            <li><a class="footer__link" href="#location">Location</a></li>
          </ul>
        </nav>
      </div>

      <div class="footer__join">
        <h3 class="footer__title">Join</h3>

        <form class="footer__form" id="footer-form" novalidate>
          <input
            class="footer__input"
            type="email"
            name="email"
            id="footer-email"
            placeholder="Enter your email*"
            required
            pattern="^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$"
            title="Введіть коректний email, наприклад name@example.com"
            aria-label="Email"
          />
          <button class="footer__button" type="submit">Sign Up</button>
        </form>

        <p class="footer__required">* Required field</p>
        <p
          class="footer__message"
          id="footer-message"
          role="status"
          aria-live="polite"
        ></p>
      </div>
    </div>

    <div class="footer__bottom">
      <p class="footer__copyright">© 2025 Booksy. All rights reserved.</p>
    </div>
  </div>
</footer>
