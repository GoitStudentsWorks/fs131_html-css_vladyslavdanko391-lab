<section class="hero">
  <div class="container">
    <div class="swiper">
      <ul class="hero-list swiper-wrapper">
        <li class="hero-list-item swiper-slide">
          <div class="hero-img-wrapper">
            <picture>
              <source
                media="(min-width: 1440px)"
                srcset="
                  ./src/img/hero/hero-banner-desktop-1@1x.avif 1x,
                  ./src/img/hero/hero-banner-desktop-1@2x.avif 2x
                "
              />

              <source
                media="(min-width: 768px)"
                srcset="
                  ./src/img/hero/hero-banner-tablet-1@1x.avif 1x,
                  ./src/img/hero/hero-banner-tablet-1@2x.avif 2x
                "
              />

              <img
                src="./src/img/hero/hero-banner-mobile-2@1x.avif"
                srcset="
                  ./src/img/hero/hero-banner-mobile-1@1x.avif 1x,
                  ./src/img/hero/hero-banner-mobile-1@2x.avif 2x
                "
                class="hero-img"
                alt="A blanket, a book, and a cup are lying on the table"
                width="343"
                height="199"
                fetchpriority="high"
              />
            </picture>
          </div>
          <div class="hero-info-wrapper">
            <p class="hero-info hero-info--first">
              Get 10% off your first order
            </p>
            <a href="#books" class="hero-link">Shop Now!</a>
          </div>
        </li>
        <li class="hero-list-item swiper-slide">
          <div class="hero-img-wrapper">
            <picture>
              <source
                media="(min-width: 1440px)"
                srcset="
                  ./src/img/hero/hero-banner-desktop-2@1x.avif 1x,
                  ./src/img/hero/hero-banner-desktop-2@2x.avif 2x
                "
              />

              <source
                media="(min-width: 768px)"
                srcset="
                  ./src/img/hero/hero-banner-tablet-2@1x.avif 1x,
                  ./src/img/hero/hero-banner-tablet-2@2x.avif 2x
                "
              />

              <img
                src="./src/img/hero/hero-banner-mobile-2@1x.avif"
                srcset="
                  ./src/img/hero/hero-banner-mobile-2@1x.avif 1x,
                  ./src/img/hero/hero-banner-mobile-2@2x.avif 2x
                "
                class="hero-img"
                alt="The book and the glasses are lying on the table"
                width="343"
                height="199"
              />
            </picture>
          </div>
          <div class="hero-info-wrapper">
            <p class="hero-info hero-info--second">Save 15% on some books</p>
            <a href="#books" class="hero-link">Shop Now!</a>
          </div>
        </li>
        <li class="hero-list-item swiper-slide">
          <div class="hero-img-wrapper">
            <picture>
              <source
                media="(min-width: 1440px)"
                srcset="
                  ./src/img/hero/hero-banner-desktop-3@1x.avif 1x,
                  ./src/img/hero/hero-banner-desktop-3@2x.avif 2x
                "
              />

              <source
                media="(min-width: 768px)"
                srcset="
                  ./src/img/hero/hero-banner-tablet-3@1x.avif 1x,
                  ./src/img/hero/hero-banner-tablet-3@2x.avif 2x
                "
              />

              <img
                src="./src/img/hero/hero-banner-mobile-3@1x.avif"
                srcset="
                  ./src/img/hero/hero-banner-mobile-3@1x.avif 1x,
                  ./src/img/hero/hero-banner-mobile-3@2x.avif 2x
                "
                class="hero-img"
                alt="Bookshelf"
                width="343"
                height="199"
              />
            </picture>
          </div>
          <div class="hero-info-wrapper">
            <p class="hero-info hero-info--third">
              <span>Summer Sale!</span> Up to -40% discounts
            </p>
            <a href="#books" class="hero-link">Shop Now!</a>
          </div>
        </li>
        <li class="hero-list-item swiper-slide">
          <div class="hero-img-wrapper">
            <picture>
              <source
                media="(min-width: 1440px)"
                srcset="
                  ./src/img/hero/hero-banner-desktop-4@1x.avif 1x,
                  ./src/img/hero/hero-banner-desktop-4@2x.avif 2x
                "
              />

              <source
                media="(min-width: 768px)"
                srcset="
                  ./src/img/hero/hero-banner-tablet-4@1x.avif 1x,
                  ./src/img/hero/hero-banner-tablet-4@2x.avif 2x
                "
              />
              <img
                src="./src/img/hero/hero-banner-mobile-4@1x.avif"
                srcset="
                  ./src/img/hero/hero-banner-mobile-4@1x.avif 1x,
                  ./src/img/hero/hero-banner-mobile-4@2x.avif 2x
                "
                class="hero-img"
                alt="A book, glasses, and a vase are lying on the table"
                width="343"
                height="199"
              />
            </picture>
          </div>
          <div class="hero-info-wrapper">
            <p class="hero-info hero-info--fourth">
              Last chance to buy our spring bestsellers
            </p>
            <a href="#books" class="hero-link">Shop Now!</a>
          </div>
        </li>
      </ul>
    </div>
    <div class="hero-title-wrapper">
      <div class="hero-navigation">
        <button
          class="hero-btn hero-btn-prev"
          type="button"
          aria-label="Previous slide"
        >
          <svg width="24" height="24">
            <use href="/icons.svg#icon-arrow-left"></use>
          </svg>
        </button>
        <button
          class="hero-btn hero-btn-next"
          type="button"
          aria-label="Next slide"
        >
          <svg width="24" height="24">
            <use href="/icons.svg#icon-arrow-right"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
