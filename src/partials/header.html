<!-- Header section -->
<header class="header" id="header">
  <div class="container header__container">
    <a href="./index.html" class="header__logo" aria-label="Booksy home">
      <svg class="header__logo-icon" width="84" height="36" aria-hidden="true">
        <use href="/icons.svg#icon-logo"></use>
      </svg>
    </a>

    <nav class="header__nav" aria-label="Main navigation">
      <ul class="header__nav-list">
        <li class="header__nav-item">
          <a href="#books" class="header__nav-link">Books</a>
        </li>
        <li class="header__nav-item">
          <a href="#feedback" class="header__nav-link">Feedbacks</a>
        </li>
        <li class="header__nav-item">
          <a href="#events" class="header__nav-link">Events</a>
        </li>
        <li class="header__nav-item">
          <a href="#article" class="header__nav-link">About</a>
        </li>
        <li class="header__nav-item">
          <a href="#location" class="header__nav-link">Location</a>
        </li>
      </ul>
    </nav>

    <button
      type="button"
      class="header__burger-btn"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
      data-menu-open
    >
      <svg class="header__burger-icon" width="24" height="24" aria-hidden="true">
        <use href="/icons.svg#icon-burger"></use>
      </svg>
    </button>
  </div>

  <div class="mobile-menu" id="mobile-menu" data-menu>
    <div class="container mobile-menu__container">
      <div class="mobile-menu__top">
        <a href="./index.html" class="header__logo" aria-label="Booksy home">
          <svg class="header__logo-icon" width="84" height="36" aria-hidden="true">
            <use href="/icons.svg#icon-logo"></use>
          </svg>
        </a>

        <button
          type="button"
          class="mobile-menu__close-btn"
          aria-label="Close menu"
          data-menu-close
        >
          <svg class="mobile-menu__close-icon" width="24" height="24" aria-hidden="true">
            <use href="/icons.svg#icon-close"></use>
          </svg>
        </button>
      </div>

      <nav class="mobile-menu__nav" aria-label="Mobile navigation">
        <ul class="mobile-menu__list">
          <li class="mobile-menu__item">
            <a href="#books" class="mobile-menu__link">Books</a>
          </li>
          <li class="mobile-menu__item">
            <a href="#feedbacks" class="mobile-menu__link">Feedbacks</a>
          </li>
          <li class="mobile-menu__item">
            <a href="#events" class="mobile-menu__link">Events</a>
          </li>
          <li class="mobile-menu__item">
            <a href="#article" class="mobile-menu__link">About</a>
          </li>
          <li class="mobile-menu__item">
            <a href="#location" class="mobile-menu__link">Location</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</header>
