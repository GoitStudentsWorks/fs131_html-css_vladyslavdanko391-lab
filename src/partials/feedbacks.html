<h2 class="feedbacks-title">Customer Feedbacks</h2>

<p class="feedbacks-subtitle">See what our readers are saying about us!</p>

<div class="feedbacks-content">
  <p class="feedbacks-text">
    Great selection, fast delivery, and beautifully packaged books. My go-to
    store for weekend reads!
  </p>

  <div class="feedbacks-user">
    <img
      class="feedbacks-avatar"
      src="https://placehold.co/56x56"
      alt="Jane Doe"
    />

    <div class="feedbacks-user-info">
      <h3 class="feedbacks-name">Jane Doe</h3>
      <p class="feedbacks-role">Book Lover, Reader</p>
    </div>
  </div>
</div>

<div class="feedbacks-controls">
  <div class="feedbacks-dots">
    <button
      class="feedbacks-dot active"
      type="button"
      aria-label="Feedback 1"
    ></button>
    <button
      class="feedbacks-dot"
      type="button"
      aria-label="Feedback 2"
    ></button>
    <button
      class="feedbacks-dot"
      type="button"
      aria-label="Feedback 3"
    ></button>
    <button
      class="feedbacks-dot"
      type="button"
      aria-label="Feedback 4"
    ></button>
  </div>

  <div class="feedbacks-arrows">
    <button
      class="feedbacks-arrow feedbacks-arrow-left"
      type="button"
      aria-label="Previous feedback"
    >
      &#8592;
    </button>

    <button
      class="feedbacks-arrow feedbacks-arrow-right"
      type="button"
      aria-label="Next feedback"
    >
      &#8594;
    </button>
  </div>
</div>
